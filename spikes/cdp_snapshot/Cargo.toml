[package]
name = "cdp_snapshot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chromiumoxide = "0.8.0"
chromiumoxide_cdp = "0.8.0"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
