<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>mbus harness actions</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", Verdana, sans-serif;
    }
    body {
      margin: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .card {
      padding: 6px;
      border: 1px solid #ddd;
    }
    #status {
      margin: 12px 0;
      padding: 6px 10px;
      border: 1px solid #bbb;
      background: #f7f7f7;
    }
  </style>
</head>
<body>
  <h1>MBUS Harness Actions</h1>
  <p>Deterministic elements for click, type, and select coverage.</p>
  <div id="status" role="status" data-testid="status">ready</div>

  <button id="click-btn" data-testid="click-button" aria-label="Click Button">Click Me</button>

  <label for="name-input">Name</label>
  <input id="name-input" data-testid="name-input" aria-label="Name" type="text" />

  <form id="submit-form">
    <label for="submit-input">Search</label>
    <input id="submit-input" data-testid="submit-input" aria-label="Search" type="text" />
    <button id="submit-btn" data-testid="submit-button" type="submit">Go</button>
  </form>

  <label for="choice-select">Choice</label>
  <select id="choice-select" data-testid="choice-select" aria-label="Choice">
    <option value="">Pick</option>
    <option value="alpha">Alpha</option>
    <option value="beta">Beta</option>
  </select>

  <div class="grid">
    <button id="extra-btn-1" data-testid="extra-btn-1">Extra 1</button>
    <button id="extra-btn-2" data-testid="extra-btn-2">Extra 2</button>
    <button id="extra-btn-3" data-testid="extra-btn-3">Extra 3</button>
    <a id="extra-link-1" data-testid="extra-link-1" href="#">Link One</a>
    <a id="extra-link-2" data-testid="extra-link-2" href="#">Link Two</a>
    <label class="card"><input id="extra-checkbox" type="checkbox" aria-label="Agree" /> Agree</label>
    <label class="card"><input id="extra-radio-a" type="radio" name="group" aria-label="Pick A" /> Pick A</label>
    <label class="card"><input id="extra-radio-b" type="radio" name="group" aria-label="Pick B" /> Pick B</label>
  </div>
  <div id="scroll-spacer" style="height: 3000px;"></div>

  <script>
    const status = document.getElementById('status');
    const setStatus = (value) => {
      status.textContent = value;
    };

    document.getElementById('click-btn').addEventListener('click', () => {
      setStatus('clicked');
    });

    document.getElementById('name-input').addEventListener('input', (event) => {
      setStatus(`typed:${event.target.value}`);
    });

    document.getElementById('submit-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const value = document.getElementById('submit-input').value;
      setStatus(`submitted:${value}`);
    });

    document.getElementById('choice-select').addEventListener('change', (event) => {
      setStatus(`selected:${event.target.value}`);
    });
  </script>
</body>
</html>
