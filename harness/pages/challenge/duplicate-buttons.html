<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Duplicate Buttons Challenge</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 2rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
      .card { border: 1px solid #cbd5e1; border-radius: 1rem; padding: 1rem; }
      .status { margin-top: 2rem; font-weight: 700; }
      button { padding: 0.75rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Choose the correct path</h1>
      <p>Pick the Continue button for checkout, not the help center.</p>
      <div class="grid">
        <section class="card">
          <h2>Help center</h2>
          <p>Browse support articles and onboarding docs.</p>
          <button class="continue" aria-label="Continue to help center">Continue</button>
        </section>
        <section class="card">
          <h2>Checkout</h2>
          <p>Continue toward the purchase flow.</p>
          <button class="continue" aria-label="Continue to checkout">Continue</button>
        </section>
      </div>
      <p class="status" id="status">Decision pending</p>
      <section id="result" hidden>
        <h2>CHECKOUT READY</h2>
      </section>
    </main>
    <script>
      const buttons = Array.from(document.querySelectorAll(".continue"));
      buttons[0].addEventListener("click", () => {
        document.getElementById("status").textContent = "HELP CENTER OPEN";
      });
      buttons[1].addEventListener("click", () => {
        document.querySelector(".grid").hidden = true;
        document.getElementById("status").textContent = "CHECKOUT READY";
        document.getElementById("result").hidden = false;
      });
    </script>
  </body>
</html>
