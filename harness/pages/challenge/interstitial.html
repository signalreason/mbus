<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Interstitial Challenge</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 2rem; }
      .overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.72); display: grid; place-items: center; }
      .card { background: white; padding: 2rem; width: min(30rem, calc(100vw - 2rem)); border-radius: 1rem; }
      .status { margin-top: 2rem; font-weight: 700; }
      button { padding: 0.75rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Showroom</h1>
      <p>Continue past the interstitial to reach the showroom.</p>
      <p class="status" id="status">Interstitial still blocking access</p>
      <section id="result" hidden>
        <h2>SHOWROOM OPEN</h2>
      </section>
    </main>
    <div class="overlay" id="overlay">
      <section class="card" aria-label="Interstitial">
        <h2>Preview access</h2>
        <p>Confirm that you want to enter the showroom.</p>
        <button id="enter">Enter showroom</button>
      </section>
    </div>
    <script>
      document.getElementById("enter").addEventListener("click", () => {
        document.getElementById("overlay").hidden = true;
        document.getElementById("status").textContent = "SHOWROOM OPEN";
        document.getElementById("result").hidden = false;
      });
    </script>
  </body>
</html>
