<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sticky Consent Challenge</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 2rem; min-height: 140vh; }
      .bar { position: fixed; inset: auto 0 0 0; background: #f59e0b; padding: 1rem 1.5rem; display: flex; gap: 1rem; align-items: center; }
      .status { margin-top: 2rem; font-weight: 700; }
      button { padding: 0.75rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Analytics consent</h1>
      <p>Update the marketing page after handling the sticky footer.</p>
      <p class="status" id="status">Sticky consent still visible</p>
      <section id="result" hidden>
        <h2>CONSENT SAVED</h2>
      </section>
    </main>
    <div class="bar" id="bar">
      <p>Enable analytics to improve campaigns.</p>
      <button id="accept-consent">Accept analytics</button>
    </div>
    <script>
      document.getElementById("accept-consent").addEventListener("click", () => {
        document.getElementById("bar").hidden = true;
        document.getElementById("status").textContent = "CONSENT SAVED";
        document.getElementById("result").hidden = false;
      });
    </script>
  </body>
</html>
