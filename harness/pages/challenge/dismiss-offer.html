<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Dismiss Offer Challenge</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 2rem; }
      .offer { position: sticky; top: 0; background: #d946ef; color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
      .status { margin-top: 2rem; font-weight: 700; }
      button { padding: 0.75rem 1rem; }
    </style>
  </head>
  <body>
    <div class="offer" id="offer">
      <p>Spring offer ends tonight.</p>
      <button id="dismiss">Dismiss offer</button>
    </div>
    <main>
      <h1>Catalog</h1>
      <p>Clear the offer bar before reviewing the catalog.</p>
      <p class="status" id="status">Offer still visible</p>
      <section id="result" hidden>
        <h2>OFFER DISMISSED</h2>
      </section>
    </main>
    <script>
      document.getElementById("dismiss").addEventListener("click", () => {
        document.getElementById("offer").hidden = true;
        document.getElementById("status").textContent = "OFFER DISMISSED";
        document.getElementById("result").hidden = false;
      });
    </script>
  </body>
</html>
